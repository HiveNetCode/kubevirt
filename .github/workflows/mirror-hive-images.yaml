name: Mirror Upstream Images Into The Hive Registry

# Maintenance helper: copies public upstream images that the fork does not
# build (e.g. the kubevirt virt-template components) into the OVH registry
# under the fleet tag, using the same dev-environment registry credentials as
# the build workflow.
on:
  workflow_dispatch:
    inputs:
      source_prefix:
        description: "Source registry + repository prefix (no trailing slash)"
        required: true
        default: "quay.io/kubevirt"
      dest_prefix:
        description: "Destination repository prefix under our registry"
        required: true
        default: "hive-compute-infra/kubevirt"
      images:
        description: "Space-separated image names to mirror"
        required: true
        default: "virt-template-apiserver virt-template-controller"
      tag:
        description: "Tag to copy (same on both sides)"
        required: true
        default: "v0.2.3"

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Login to OVH registry
        run: |
          export LC_ALL=C
          missing=()
          [ -n "$REGISTRY_URL" ] || missing+=("var DOCKER_REGISTRY")
          [ -n "$REGISTRY_USERNAME" ] || missing+=("var DOCKER_USERNAME")
          [ -n "$REGISTRY_PASSWORD" ] || missing+=("secret DOCKER_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::dev environment is missing: ${missing[*]}"
            exit 1
          fi
          printf '%s\n' "$REGISTRY_PASSWORD" | docker login \
            "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin
        env:
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          REGISTRY_URL: ${{ vars.DOCKER_REGISTRY }}
          REGISTRY_USERNAME: ${{ vars.DOCKER_USERNAME }}

      - name: Mirror images
        # Inputs reach the script only through env and are format-checked, so
        # a crafted value can become neither shell code nor a docker option.
        env:
          SRC_PREFIX: ${{ inputs.source_prefix }}
          DST_PREFIX: ${{ inputs.dest_prefix }}
          REGISTRY_URL: ${{ vars.DOCKER_REGISTRY }}
          TAG: ${{ inputs.tag }}
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          prefix_re='^[A-Za-z0-9][A-Za-z0-9._:/-]*$'
          name_re='^[a-z0-9]+([._/-][a-z0-9]+)*$'
          tag_re='^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'
          [[ "$SRC_PREFIX" =~ $prefix_re ]] || { echo "::error::invalid source_prefix"; exit 1; }
          [[ "$DST_PREFIX" =~ $prefix_re ]] || { echo "::error::invalid dest_prefix"; exit 1; }
          [[ "$TAG" =~ $tag_re ]] || { echo "::error::invalid tag"; exit 1; }
          [[ "$IMAGES" != *$'\n'* ]] || { echo "::error::images must be one space-separated line"; exit 1; }
          read -r -a imgs <<< "$IMAGES"
          [ "${#imgs[@]}" -gt 0 ] || { echo "::error::no images given"; exit 1; }
          for img in "${imgs[@]}"; do
            [[ "$img" =~ $name_re ]] || { echo "::error::invalid image name: $img"; exit 1; }
          done
          for img in "${imgs[@]}"; do
            src="${SRC_PREFIX}/${img}:${TAG}"
            dst="${REGISTRY_URL}/${DST_PREFIX}/${img}:${TAG}"
            echo "::group::mirror ${src} -> ${dst}"
            docker pull "$src"
            docker tag "$src" "$dst"
            docker push "$dst"
            echo "::endgroup::"
          done
