name: Label Approved VEP PRs
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  check-vep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run VEP check script
        env:
          # Built-in token (always fresh) instead of a secret: a stored PAT
          # goes stale as soon as it is rotated, which 401s the PR lookup.
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_PROJECT_URL: "https://github.com/orgs/kubevirt/projects/21"
        run: python automation/label-approved-veps.py
