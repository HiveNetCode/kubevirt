name: Build Hive KubeVirt Images

# Serialise builds per image tag so concurrent dispatches cannot push to the
# same registry tag simultaneously (COMP-4086).
concurrency:
  group: hive-images-${{ github.event.inputs.tag }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to build (e.g. chore/COMP-3399-kubevirt-1.9.1)"
        required: true
        default: "main"
      tag:
        description: "Image tag to build and push (e.g. v1.9.1)"
        required: true
        default: "v1.9.1"
      push_targets:
        description: "Space-separated image targets to build and push"
        required: false
        default: "virt-operator virt-api virt-controller virt-handler virt-launcher conformance pr-helper libguestfs-tools network-passt-binding"

# The repo default grants GITHUB_TOKEN write access. This job only reads the
# repo and pushes with the OVH credentials, so the token needs nothing more.
permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Same environment pattern as kubevirt-gpu-device-plugin's Build Hive
    # Image workflow: one GitHub environment holds the OVH registry
    # credentials (vars DOCKER_REGISTRY / DOCKER_USERNAME, secret
    # DOCKER_PASSWORD). Fleet images are promoted across dev/staging/
    # production via GitOps tag bumps, so no per-environment variants exist.
    environment: dev
    name: Build and push KubeVirt images
    timeout-minutes: 360
    steps:
      # Env vars alone are not enough: the Makefile pastes DOCKER_TAG and
      # PUSH_TARGETS into a command string that a shell parses again, and make
      # expands $(...) in them, so only plain characters may pass. The patterns
      # sit in variables because bash cannot parse a bare space inside
      # [[ =~ ]], and LC_ALL=C keeps the ranges ASCII-only in every locale.
      - name: Validate inputs
        run: |
          export LC_ALL=C
          ref_re='^[A-Za-z0-9._/-]+$'
          tag_re='^[A-Za-z0-9][A-Za-z0-9._-]*$'
          targets_re='^[A-Za-z0-9._/ -]+$'
          if ! [[ "$INPUT_REF" =~ $ref_re ]]; then
            echo "::error::ref does not match expected pattern (A-Za-z0-9._/- only)"
            exit 1
          fi
          if ! [[ "$INPUT_TAG" =~ $tag_re ]]; then
            echo "::error::tag does not match expected pattern (Docker tag format)"
            exit 1
          fi
          if [ -n "$INPUT_PUSH_TARGETS" ] && ! [[ "$INPUT_PUSH_TARGETS" =~ $targets_re ]]; then
            echo "::error::push_targets contains disallowed characters"
            exit 1
          fi
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PUSH_TARGETS: ${{ github.event.inputs.push_targets }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Not imjasonh/setup-crane: it logs crane in to ghcr.io with the job
      # token, in the ~/.docker/config.json that hack/dockerized mounts into
      # the build container.
      - name: Install crane
        run: |
          archive="$RUNNER_TEMP/go-containerregistry.tar.gz"
          curl --proto '=https' -fsSL --retry 5 --retry-all-errors -o "$archive" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/crane"
          tar -xzf "$archive" -C "$RUNNER_TEMP/crane" crane
          echo "$RUNNER_TEMP/crane" >> "$GITHUB_PATH"
        env:
          CRANE_VERSION: v0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0

      # docker login sends the credentials to Docker Hub when the registry is
      # empty or one of Docker Hub's names, and the registry also ends up in
      # DOCKER_PREFIX, which the Makefile pastes into a command string that a
      # shell parses again. The host needs a dot, or docker and crane read it
      # as a Docker Hub namespace. printf, not echo: echo would take a
      # password such as -n as an option and send nothing.
      - name: Login to OVH registry
        run: |
          export LC_ALL=C
          registry_re='^[A-Za-z0-9][A-Za-z0-9-]*(\.[A-Za-z0-9-]+)+(:[0-9]+)?$'
          missing=()
          [ -n "$REGISTRY_URL" ] || missing+=("var DOCKER_REGISTRY")
          [ -n "$REGISTRY_USERNAME" ] || missing+=("var DOCKER_USERNAME")
          [ -n "$REGISTRY_PASSWORD" ] || missing+=("secret DOCKER_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::dev environment is missing: ${missing[*]}"
            exit 1
          fi
          if ! [[ "$REGISTRY_URL" =~ $registry_re ]]; then
            echo "::error::DOCKER_REGISTRY must be a plain host or host:port"
            exit 1
          fi
          registry_host=${REGISTRY_URL%%:*}
          case "${registry_host,,}" in
            docker.io | *.docker.io | docker.com | *.docker.com)
              echo "::error::DOCKER_REGISTRY must not be Docker Hub"
              exit 1
              ;;
          esac
          printf '%s\n' "$REGISTRY_PASSWORD" | docker login \
            "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin
        env:
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          REGISTRY_URL: ${{ vars.DOCKER_REGISTRY }}
          REGISTRY_USERNAME: ${{ vars.DOCKER_USERNAME }}

      - name: Build and push images
        run: |
          DOCKER_PREFIX="${HIVE_IMAGE_REPO}" \
          DOCKER_TAG="$INPUT_TAG" \
          PUSH_TARGETS="$INPUT_PUSH_TARGETS" \
          make bazel-push-images
        env:
          # The runner image ships podman too, and hack/common.sh prefers it
          # when this is unset, but only docker holds the registry login.
          KUBEVIRT_CRI: docker
          # Same registry layout as the v1.8.4-memlock fleet build:
          #   <DOCKER_REGISTRY>/hive-compute-infra/kubevirt/<component>:<tag>
          # KubeVirt's Makefile takes its own image-name prefix from the
          # environment, so the path reaches make only as DOCKER_PREFIX.
          HIVE_IMAGE_REPO: ${{ vars.DOCKER_REGISTRY }}/hive-compute-infra/kubevirt
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PUSH_TARGETS: ${{ github.event.inputs.push_targets }}

      - name: Verify pushed fleet tags
        run: |
          missing=0
          for img in virt-operator virt-api virt-controller virt-handler virt-launcher; do
            echo "-- ${HIVE_IMAGE_REPO}/${img}:${INPUT_TAG}"
            if crane manifest "${HIVE_IMAGE_REPO}/${img}:${INPUT_TAG}" > /dev/null; then
              echo "OK: ${img}"
            else
              echo "::error::missing or unreadable: ${HIVE_IMAGE_REPO}/${img}:${INPUT_TAG}"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            exit 1
          fi
          echo "Fleet image set verified in ${HIVE_IMAGE_REPO}"
        env:
          HIVE_IMAGE_REPO: ${{ vars.DOCKER_REGISTRY }}/hive-compute-infra/kubevirt
          INPUT_TAG: ${{ github.event.inputs.tag }}
